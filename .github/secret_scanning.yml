# Secret scanning configuration
# Docs: https://docs.github.com/en/code-security/secret-scanning
#
# Paths listed here are excluded from secret scanning AND from push
# protection. Keep this list as narrow as possible — every excluded path
# is a place real secrets could hide.

paths-ignore:
  # Example env files only contain placeholders / instructions.
  - "**/.env.example"
  - "**/.env.sample"
  # Generated lockfile occasionally trips on registry tokens that look
  # like API keys but are public package metadata.
  - "pnpm-lock.yaml"
  # Test fixtures: any fake tokens here are intentional and inert.
  - "**/__fixtures__/**"
  - "**/test/fixtures/**"
